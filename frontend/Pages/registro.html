<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="../Styles/registro.css">
</head>
<body>

    <div class="contenedor">
        <h2>Registro</h2>
        <form id="registroForm">
            <input type="text" id="nameUser" name="nameUser" placeholder="Nombre de usuario" required>
            <input type="email" id="correo" name="correo" placeholder="Correo electrónico" required>
            <input type="password" id="password" autocomplete="on" name="password" placeholder="Contraseña" required>
            <button type="submit">Registrarse</button>
        </form>
        <br>
        <a href="inicio_sesion.html">Ya tengo cuenta</a>
    </div>

    <script src="../js/registro.js"></script>
</body>
</html>
