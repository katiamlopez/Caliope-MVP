<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
</head>
<body class="bg-light"> 

    <div class="text-center mb-4 mt-4">
        <img src="https://raw.githubusercontent.com/katiamlopez/Caliope-MVP/1199798a94cd2b97b62eab81c645637c96fdd44f/frontend/assets/logo-caliope.svg" alt="Logo Caliope" width="220">
    </div>

    <div class="container mb-5" style="max-width: 600px;">
        <h2 class="text-center mb-4">Crear cuenta</h2>

        <form id="registroForm">
            <!-- Nombre y Apellido -->
            <div class="row mb-3">
                <div class="col">
                    <h5>Nombre</h5>
                    <input type="text" class="form-control" name="nombreU" minlength="2" maxlength="50" placeholder="Ingresa tu nombre" required>
                </div>
                <div class="col">
                    <h5>Apellido</h5>
                    <input type="text" class="form-control" name="apellidoU" minlength="2" maxlength="50"placeholder="Ingresa tu apellido" required>
                </div>
            </div>

            <!-- Correo -->
            <h5>Dirección de correo electrónico</h5>
            <input type="email" class="form-control" name="correo" placeholder="Ingresa el correo electrónico" required>

            <!-- Usuario -->
            <h5 class="mt-4">Nombre de usuario</h5>
            <input type="text" class="form-control" autocomplete="additional-name" name="nickname" placeholder="Ingresa tu nombre de usuario" required>

            <!-- Cumpleaños -->
            <h5 class="mt-4">Cumpleaños</h5>
            <div class="row">
                <div class="col">
                    <select class="form-select" name="mes" id="mes">
                        <option selected disabled>Mes</option>
                        <option>Enero</option>
                        <option>Febrero</option>
                        <option>Marzo</option>
                        <option>Abril</option>
                        <option>Mayo</option>
                        <option>Junio</option>
                        <option>Julio</option>
                        <option>Agosto</option>
                        <option>Septiembre</option>
                        <option>Octubre</option>
                        <option>Noviembre</option>
                        <option>Diciembre</option>
                    </select>
                </div>
                <div class="col">
                    <select class="form-select" name="dia" id="dias">
                        <option selected disabled>Día</option>
                    </select>
                </div>
                <div class="col">
                    <select class="form-select" name="anio" id="anio">
                        <option selected disabled>Año</option>
                    </select>
                </div>
            </div>

            <!-- Pronombres -->
            <h5 class="mt-4">Pronombres (opcional)</h5>
            <select class="form-select" name="pronombre">
                <option selected>Pronombres (opcional)</option>
                <option>Ella</option>
                <option>Él</option>
                <option>Elle</option>
                <option>No binario</option>
                <option>No listado</option>
                <option>Prefiero no decirlo</option>
            </select>

            <!-- Contraseña -->
            <h5 class="mt-4">Contraseña</h5>
            <input type="password" class="form-control"   autocomplete="new-password" name="password" placeholder="Ingresa tu contraseña" required>

            <h5 class="mt-4">Vuelva a introducir la contraseña</h5>
            <input type="password" class="form-control"   autocomplete="new-password" name="confirmPassword" placeholder="Vuelva a introducir la contraseña" required>

            <!-- Términos -->
            <div class="form-check mt-3">
                <input class="form-check-input" type="checkbox" id="terminos" required>
                <label class="form-check-label" for="terminos">
                    He leído y acepto los Términos de Servicio y la Política de Privacidad.
                </label>
            </div>

            <button type="submit" class="btn btn-dark rounded-pill w-100 mt-4">
                Regístrate con un correo electrónico
            </button>

            <a href="inicio_sesion.html" class="btn btn-outline-dark rounded-pill w-100 mt-2 text-center d-block">
                Ya tengo cuenta
            </a>

        </form>
    </div>


    <script src="../js/registro.js"></script>

   <!-- Footer inferior -->
            <footer class="site-footer site-footer--bottom">

                <nav
                    class="site-footer-links"
                    aria-label="Enlaces informativos"
                >
                    <a href="nosotrosli.html">
                        Acerca de
                    </a>

                    <a href="contactanos.html">
                        Contáctanos
                    </a>

                    <a href="aviso-privacidad.html">
                        Aviso de privacidad
                    </a>
                </nav>

                <!-- Logo y copyright en la misma línea -->
                <div class="site-footer-brand">

                    <a
                        href="principal.html"
                        class="site-footer-logo"
                        aria-label="Ir a la página principal"
                    >
                        <img
                            src="../assets/logo-caliope.svg"
                            alt="Logo de Calíope"
                        >
                    </a>

                    <p class="site-footer-copyright">
                        Calíope © 2026
                    </p>

                </div>

            </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Generar Días
        let selectDia = document.getElementById("dias");
        for (let i = 1; i <= 31; i++) {
            let opcion = document.createElement("option");
            opcion.textContent = i;
            selectDia.appendChild(opcion);
        }

        // Generar Años
        let selectAnio = document.getElementById("anio");
        for (let i = 2026; i >= 1950; i--) {
            let opcion = document.createElement("option");
            opcion.textContent = i;
            selectAnio.appendChild(opcion);
        }
    </script>

</body>
</html>
