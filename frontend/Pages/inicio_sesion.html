<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Caliope</title>
    
    <link rel="stylesheet" href="../Styles/globales.css">
    <link rel="stylesheet" href="../Styles/inicio_sesion.css">
    <link rel="stylesheet" href="/frontend/Styles/Logo.css">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="logo-container-center logo-caliope">
            <div class="Login-logo"></div>
            
        </div>

        <h4 class="text-title text-center title-spacing">Iniciar sesión</h4>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="correo">Correo electrónico</label>
                <input type="email" id="correo" class="form-control" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Contraseña</label>
                <div class="input-with-icon">
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                    <button type="button" class="toggle-password" id="togglePassword">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12C23 12 19 20 12 20C5 20 1 12 1 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="forgot-password">
                <a href="#" class="link-secondary">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn btn-primary full-width">Iniciar sesión</button>
        </form>

        <p id="mensaje" class="form-message"></p>

        <div class="register-link">
            <span class="text-secondary">¿No tienes cuenta?</span> <a href="registro.html" class="link-primary">Regístrate</a>
        </div>
    </div>

    <script>
        // Lógica para mostrar/ocultar contraseña
        const togglePassword = document.getElementById("togglePassword");
        const passwordInput = document.getElementById("password");

        togglePassword.addEventListener("click", function () {
            const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
            passwordInput.setAttribute("type", type);
            // Cambia la opacidad del icono para dar feedback visual
            this.style.opacity = type === "text" ? "1" : "0.5";
        });

        // Lógica de inicio de sesión
        // Usuarios de prueba guardados en localStorage
if (!localStorage.getItem("usuarios")) {
    const usuariosPrueba = [
        {
            correo: "oscar@gmail.com",
            password: "1234"
        }
    ];

    localStorage.setItem("usuarios", JSON.stringify(usuariosPrueba));
}

// Si ya hay sesión activa, mandar directo a principal
const sesionActiva = localStorage.getItem("sesionActiva");

if (sesionActiva) {
    window.location.href = "principal.html";
}

/* Lógica de inicio de sesión*/
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let correo = document.getElementById("correo").value.trim();
    let passwordValue = document.getElementById("password").value.trim();
    let mensajeEl = document.getElementById("mensaje");

    let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

    let usuarioEncontrado = usuarios.find(function(usuario) {
        return usuario.correo === correo && usuario.password === passwordValue;
    });

    if (usuarioEncontrado) {
        localStorage.setItem("sesionActiva", JSON.stringify(usuarioEncontrado));

        mensajeEl.style.color = "var(--color-primary)";
        mensajeEl.textContent = "Acceso permitido...";

        setTimeout(() => {
            window.location.href = "principal.html";
        }, 800);

    } else {
        mensajeEl.style.color = "#d32f2f";
        mensajeEl.textContent = "Usuario o contraseña incorrectos";
    }
});
    </script>

</body>
</html>
